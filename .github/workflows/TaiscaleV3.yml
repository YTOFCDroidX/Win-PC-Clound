name: Windows RDP Gaming Setup

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Tempo ativo (minutos)'
        required: true
        default: '360'

jobs:
  windows-rdp:
    runs-on: windows-latest
    
    steps:
      - name: Instalar Tailscale
        run: |
          Write-Host "📥 Baixando Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          
          Write-Host "⚙️ Instalando..."
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" -Wait -NoNewWindow
          Start-Sleep -Seconds 15
          
      - name: Conectar ao Tailscale
        run: |
          Write-Host "🔗 Conectando ao Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-kK7Wmdjzme11CNTRL-2tVaXw7poh9G2WzD6TH9i995bZkru8LTU --hostname=github-gaming-${{ github.run_number }} --accept-routes
          Start-Sleep -Seconds 10
          
      - name: Configurar RDP e Usuário
        run: |
          Write-Host "👤 Criando usuário..."
          
          $Password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 14 | ForEach-Object {[char]$_})
          $SecurePass = ConvertTo-SecureString $Password -AsPlainText -Force
          
          try {
              New-LocalUser -Name "gamer" -Password $SecurePass -FullName "Gaming User" -Description "Gaming Setup" -ErrorAction Stop
              Add-LocalGroupMember -Group "Administrators" -Member "gamer" -ErrorAction Stop
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "gamer" -ErrorAction Stop
          } catch {
              Write-Host "⚠️ Usuário pode já existir, resetando senha..."
              Set-LocalUser -Name "gamer" -Password $SecurePass
          }
          
          Write-Host "🖥️ Habilitando RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          $Password | Out-File -FilePath "$env:TEMP\rdp_password.txt" -Force
          
          Write-Host "✅ Usuário criado!"

      - name: Instalar Chocolatey
        run: |
          Write-Host "🍫 Instalando Chocolatey..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
      - name: Instalar Steam
        run: |
          Write-Host "🎮 Instalando Steam..."
          choco install steam -y --ignore-checksums
          Write-Host "✅ Steam instalado!"
          
      - name: Baixar e Instalar LuaTools
        run: |
          Write-Host "🔧 Baixando LuaTools v1.3.1..."
          
          $LuaToolsUrl = "https://github.com/madoiscool/LuaTools/releases/download/v1.3.1/LuaTools-win-Setup.exe"
          $LuaToolsInstaller = "$env:TEMP\LuaTools-Setup.exe"
          
          try {
              Invoke-WebRequest -Uri $LuaToolsUrl -OutFile $LuaToolsInstaller -UseBasicParsing
              Write-Host "✅ LuaTools baixado!"
              
              Write-Host "⚙️ Instalando LuaTools..."
              Start-Process -FilePath $LuaToolsInstaller -ArgumentList "/S" -Wait -NoNewWindow
              
              Write-Host "✅ LuaTools instalado!"
              
              $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
              if (Test-Path "$env:LOCALAPPDATA\Programs\luatools\LuaTools.exe") {
                  $WshShell = New-Object -ComObject WScript.Shell
                  $Shortcut = $WshShell.CreateShortcut("$Desktop\LuaTools.lnk")
                  $Shortcut.TargetPath = "$env:LOCALAPPDATA\Programs\luatools\LuaTools.exe"
                  $Shortcut.Save()
                  Write-Host "✅ Atalho criado na área de trabalho!"
              }
          } catch {
              Write-Host "⚠️ Erro ao instalar LuaTools: $_"
              Write-Host "📥 Instalador salvo em: $LuaToolsInstaller"
          }
          
      - name: Baixar e Instalar Roblox
        run: |
          Write-Host "🎮 Baixando Roblox Player..."
          
          $RobloxInstaller = "$env:TEMP\RobloxPlayerLauncher.exe"
          
          try {
              Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxPlayerLauncher.exe" -OutFile $RobloxInstaller -UseBasicParsing
              
              Write-Host "⚙️ Instalando Roblox..."
              Start-Process -FilePath $RobloxInstaller -Wait -NoNewWindow
              
              Write-Host "✅ Roblox instalado!"
          } catch {
              Write-Host "⚠️ Erro ao baixar Roblox: $_"
          }

      - name: Baixar Wallpapers Minecraft Lofi
        run: |
          Write-Host "🖼️ Baixando wallpapers Minecraft Lofi..."
          
          $WallpaperPath = "C:\Users\Public\Pictures\Wallpapers"
          New-Item -ItemType Directory -Path $WallpaperPath -Force | Out-Null
          
          Write-Host "📦 Instalando ImageMagick..."
          choco install imagemagick -y
          
          Write-Host "📥 Baixando Minecraft Rainy House..."
          try {
              Invoke-WebRequest -Uri "https://i.imgur.com/2xKzL8Y.jpg" -OutFile "$WallpaperPath\minecraft-rainy-house.jpg" -UseBasicParsing
              Write-Host "✅ Wallpaper 1 baixado!"
          } catch {
              Write-Host "⚠️ Erro ao baixar wallpaper 1: $_"
          }
          
          Write-Host "📥 Baixando Minecraft Lofi Fireplace..."
          try {
              Invoke-WebRequest -Uri "https://i.imgur.com/9xQKV8N.jpg" -OutFile "$WallpaperPath\minecraft-lofi-fireplace.jpg" -UseBasicParsing
              Write-Host "✅ Wallpaper 2 baixado!"
          } catch {
              Write-Host "⚠️ Erro ao baixar wallpaper 2: $_"
          }
          
          Write-Host "📁 Wallpapers salvos em: $WallpaperPath"

      - name: Configurar Wallpaper Minecraft Lofi
        run: |
          Write-Host "🎨 Configurando wallpaper..."
          
          $WallpaperPath = "C:\Users\Public\Pictures\Wallpapers\minecraft-rainy-house.jpg"
          
          if (Test-Path $WallpaperPath) {
              $code = @'
              using System;
              using System.Runtime.InteropServices;
              public class Wallpaper {
                  [DllImport("user32.dll", CharSet=CharSet.Auto)]
                  public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
              }
'@
              Add-Type -TypeDefinition $code
              
              [Wallpaper]::SystemParametersInfo(20, 0, $WallpaperPath, 3)
              
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name WallpaperStyle -Value 10
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name TileWallpaper -Value 0
              
              Write-Host "✅ Wallpaper Minecraft Lofi Rainy House configurado!"
          } else {
              Write-Host "⚠️ Wallpaper não encontrado em: $WallpaperPath"
          }

      - name: Criar arquivo de informações
        run: |
          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          
          $line1 = "═══════════════════════════════════════════════════════════"
          $line2 = "        🎮 GAMING SETUP - WINDOWS RDP"
          $line3 = "═══════════════════════════════════════════════════════════"
          $line4 = ""
          $line5 = "✅ APPS INSTALADOS:"
          $line6 = ""
          $line7 = "🎮 Steam - C:\Program Files (x86)\Steam\steam.exe"
          $line8 = "🔧 LuaTools v1.3.1 - Atalho na área de trabalho"
          $line9 = "🎮 Roblox Player"
          $line10 = "🖼️ ImageMagick - Conversor de imagens"
          $line11 = ""
          $line12 = "═══════════════════════════════════════════════════════════"
          $line13 = "🖼️ WALLPAPERS MINECRAFT LOFI:"
          $line14 = "═══════════════════════════════════════════════════════════"
          $line15 = ""
          $line16 = "📁 Localização: C:\Users\Public\Pictures\Wallpapers\"
          $line17 = ""
          $line18 = "🎨 Wallpapers disponíveis:"
          $line19 = "   • minecraft-rainy-house.jpg (APLICADO)"
          $line20 = "   • minecraft-lofi-fireplace.jpg"
          $line21 = ""
          $line22 = "Para trocar: Botão direito → Personalizar → Plano de fundo"
          $line23 = ""
          $line24 = "═══════════════════════════════════════════════════════════"
          $line25 = "🎵 WALLPAPERS ANIMADOS (OPCIONAL):"
          $line26 = "═══════════════════════════════════════════════════════════"
          $line27 = ""
          $line28 = "1. Abra o Steam"
          $line29 = "2. Compre Wallpaper Engine"
          $line30 = "3. Procure Minecraft Lofi na Workshop"
          $line31 = ""
          $line32 = "Aproveite seu setup gaming!"
          
          $InfoContent = "$line1`n$line2`n$line3`n$line4`n$line5`n$line6`n$line7`n$line8`n$line9`n$line10`n$line11`n$line12`n$line13`n$line14`n$line15`n$line16`n$line17`n$line18`n$line19`n$line20`n$line21`n$line22`n$line23`n$line24`n$line25`n$line26`n$line27`n$line28`n$line29`n$line30`n$line31`n$line32"
          
          $InfoContent | Out-File -FilePath "$Desktop\GAMING_SETUP_INFO.txt" -Encoding UTF8
          Write-Host "✅ Arquivo de informações criado!"

      - name: INFORMAÇÕES DE CONEXÃO
        run: |
          $IP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          $Password = Get-Content "$env:TEMP\rdp_password.txt"
          
          Write-Host ""
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host "          🎮 GAMING SETUP - PRONTO!"
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host ""
          Write-Host "🔑 CREDENCIAIS RDP:"
          Write-Host "   IP: $IP"
          Write-Host "   Usuário: gamer"
          Write-Host "   Senha: $Password"
          Write-Host ""
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host "          ✅ INSTALADO:"
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host ""
          Write-Host "  🎮 Steam"
          Write-Host "  🔧 LuaTools v1.3.1"
          Write-Host "  🎮 Roblox Player"
          Write-Host "  🖼️ Wallpaper Minecraft Lofi - APLICADO"
          Write-Host ""
          Write-Host "⏰ Sessão ativa por ${{ github.event.inputs.duration }} minutos"
          Write-Host ""
          
      - name: Manter servidor ativo
        run: |
          $Duration = [int]"${{ github.event.inputs.duration }}"
          Write-Host "🟢 Servidor GAMING ativo!"
          Write-Host ""
          
          for ($i = 1; $i -le $Duration; $i++) {
              $Remaining = $Duration - $i
              $Sessions = qwinsta 2>$null | Select-String "rdp" | Measure-Object
              $ActiveRDP = $Sessions.Count
              
              if ($i % 1 -eq 0) {
                  $Timestamp = Get-Date -Format "HH:mm:ss"
                  Write-Host "[$Timestamp] ⏰ $i/$Duration min | Restam $Remaining | 🎮 Conexões: $ActiveRDP"
              }
              
              if ($i % 10 -eq 0) {
                  $CurrentIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
                  Write-Host "📍 IP: $CurrentIP"
              }
              
              Start-Sleep -Seconds 60
          }
          
          Write-Host "⏱️ Tempo esgotado!"
          
      - name: Limpeza
        if: always()
        run: |
          Write-Host "🔌 Desconectando..."
          & "C:\Program Files\Tailscale\tailscale.exe" down
          Remove-Item "$env:TEMP\rdp_password.txt" -ErrorAction SilentlyContinue
          Write-Host "✅ Sessão encerrada!" 
