name: Windowszz Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download and Install AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"
          
          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer
          
          Write-Host "✅ AnyDesk baixado"
          
          Start-Process `
            -FilePath $installer `
            -ArgumentList "--install `"C:\AnyDesk`" --start-with-win --silent" `
            -Wait
          
          Write-Host "✅ AnyDesk instalado"

      - name: Start AnyDesk and Wait
        shell: powershell
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          
          # Inicia o AnyDesk
          Start-Process -FilePath $anydeskPath
          
          Write-Host "⏳ Aguardando AnyDesk inicializar..."
          Start-Sleep -Seconds 30
          
          # Verifica se está rodando
          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($process) {
            Write-Host "✅ AnyDesk está rodando (PID: $($process.Id))"
          }

      - name: Get AnyDesk ID (Multiple Attempts)
        shell: powershell
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          $id = $null
          $attempts = 0
          $maxAttempts = 10
          
          while ([string]::IsNullOrWhiteSpace($id) -and $attempts -lt $maxAttempts) {
            $attempts++
            Write-Host "🔍 Tentativa $attempts de $maxAttempts para obter ID..."
            
            try {
              $id = & $anydeskPath --get-id 2>&1 | Out-String
              $id = $id.Trim()
              
              if (![string]::IsNullOrWhiteSpace($id) -and $id -match '^\d+$') {
                Write-Host "✅ ID obtido com sucesso!"
                break
              } else {
                Write-Host "⚠️ ID ainda não disponível, aguardando..."
                Start-Sleep -Seconds 5
              }
            } catch {
              Write-Host "⚠️ Erro ao obter ID: $_"
              Start-Sleep -Seconds 5
            }
          }
          
          # Salva o ID em variável de ambiente
          echo "ANYDESK_ID=$id" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "================================" -ForegroundColor Green
          Write-Host "   ID ANYDESK OBTIDO" -ForegroundColor Yellow
          Write-Host "================================" -ForegroundColor Green
          Write-Host "ID: $id" -ForegroundColor Cyan
          Write-Host "================================" -ForegroundColor Green

      - name: Set Password
        shell: powershell
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          $password = "Github123"
          
          # Define a senha
          echo $password | & $anydeskPath --set-password
          
          Start-Sleep -Seconds 3
          
          Write-Host ""
          Write-Host "================================" -ForegroundColor Green
          Write-Host "   CREDENCIAIS COMPLETAS" -ForegroundColor Yellow
          Write-Host "================================" -ForegroundColor Green
          Write-Host "ID: $env:ANYDESK_ID" -ForegroundColor Cyan
          Write-Host "Senha: $password" -ForegroundColor Cyan
          Write-Host "================================" -ForegroundColor Green
          Write-Host ""

      - name: Keep Session Active
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "🟢 SESSÃO ATIVA - Conecte-se agora!" -ForegroundColor Green
          Write-Host "ID: $env:ANYDESK_ID" -ForegroundColor Yellow
          Write-Host "Senha: Github123" -ForegroundColor Yellow
          Write-Host ""
          
          $endTime = (Get-Date).AddMinutes(350)
          
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date))
            $hours = [math]::Floor($remaining.TotalHours)
            $minutes = $remaining.Minutes
            
            Write-Host "⏱️ Tempo restante: ${hours}h ${minutes}m | ID: $env:ANYDESK_ID | Senha: Github123"
            Start-Sleep -Seconds 300
          }
