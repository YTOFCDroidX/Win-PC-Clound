name: Windowsiu Cloud PC - AnyDesk (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download and Install AnyDesk
        run: |
          Write-Host "📥 Baixando AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
          
          Write-Host "⚙️ Instalando AnyDesk..."
          Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install C:\AnyDesk --start-with-win --silent" -Wait
          
          Write-Host "✅ AnyDesk instalado em C:\AnyDesk"

      - name: Start AnyDesk and Wait for Initialization
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          
          Write-Host "🚀 Iniciando AnyDesk..."
          Start-Process -FilePath $anydeskPath
          
          Write-Host "⏳ Aguardando inicialização (30 segundos)..."
          Start-Sleep -Seconds 30
          
          # Verifica se está rodando
          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($process) {
            Write-Host "✅ AnyDesk rodando (PID: $($process.Id))"
          } else {
            Write-Host "❌ AnyDesk não iniciou corretamente"
            exit 1
          }

      - name: Get AnyDesk ID (Multiple Attempts)
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          $anydeskId = $null
          $maxAttempts = 15
          
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "🔍 Tentativa $i/$maxAttempts para obter ID..."
            
            try {
              $output = & $anydeskPath --get-id 2>&1 | Out-String
              $output = $output.Trim()
              
              # Verifica se é um ID válido (numérico, 9-10 dígitos)
              if ($output -match '^\d{9,10}$') {
                $anydeskId = $output
                Write-Host "✅ ID obtido: $anydeskId"
                break
              } else {
                Write-Host "⚠️ Resposta inválida: '$output'"
              }
            } catch {
              Write-Host "⚠️ Erro: $_"
            }
            
            if ($i -lt $maxAttempts) {
              Start-Sleep -Seconds 4
            }
          }
          
          if ([string]::IsNullOrWhiteSpace($anydeskId)) {
            Write-Host "❌ Não foi possível obter o ID após $maxAttempts tentativas"
            
            # Tenta método alternativo via service.conf
            $confPath = "C:\ProgramData\AnyDesk\service.conf"
            if (Test-Path $confPath) {
              Write-Host "📄 Tentando extrair do arquivo de configuração..."
              $content = Get-Content $confPath -Raw
              if ($content -match 'ad\.anynet\.id=(\d+)') {
                $anydeskId = $matches[1]
                Write-Host "✅ ID encontrado no config: $anydeskId"
              }
            }
          }
          
          # Salva em variável de ambiente
          echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "╔══════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║      ANYDESK ID OBTIDO           ║" -ForegroundColor Yellow
          Write-Host "╠══════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  ID: $anydeskId" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""

      - name: Set AnyDesk Password
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          $password = "Github2024"
          
          Write-Host "🔐 Configurando senha..."
          
          # Método 1: Via stdin
          $password | & $anydeskPath --set-password
          Start-Sleep -Seconds 3
          
          # Método 2: Via comando direto (fallback)
          & $anydeskPath --set-password="$password"
          Start-Sleep -Seconds 2
          
          Write-Host "✅ Senha configurada: $password"

      - name: Display Complete Credentials
        run: |
          Write-Host ""
          Write-Host "╔════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║                                        ║" -ForegroundColor Green
          Write-Host "║     🖥️  CREDENCIAIS DO ANYDESK 🖥️      ║" -ForegroundColor Yellow
          Write-Host "║                                        ║" -ForegroundColor Green
          Write-Host "╠════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║                                        ║" -ForegroundColor Green
          Write-Host "║  📍 ID:    $env:ANYDESK_ID              " -ForegroundColor Cyan
          Write-Host "║  🔑 Senha: Github2024                  ║" -ForegroundColor Cyan
          Write-Host "║                                        ║" -ForegroundColor Green
          Write-Host "╚════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""
          Write-Host "👉 Use essas credenciais no AnyDesk para conectar!" -ForegroundColor Yellow
          Write-Host ""

      - name: Monitor and Keep Session Active
        run: |
          $startTime = Get-Date
          $maxMinutes = 350
          
          Write-Host "🟢 SESSÃO ATIVA - Pode conectar agora!" -ForegroundColor Green
          Write-Host ""
          
          while ($true) {
            $elapsed = ((Get-Date) - $startTime).TotalMinutes
            $remaining = $maxMinutes - [math]::Floor($elapsed)
            
            if ($remaining -le 0) {
              Write-Host "⏰ Tempo máximo atingido (6 horas)"
              break
            }
            
            # Verifica se AnyDesk ainda está rodando
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            
            if (-not $process) {
              Write-Host "⚠️ AnyDesk parou! Reiniciando..." -ForegroundColor Yellow
              Start-Process -FilePath "C:\AnyDesk\AnyDesk.exe"
              Start-Sleep -Seconds 10
            }
            
            # Exibe status a cada 5 minutos
            if ([math]::Floor($elapsed) % 5 -eq 0) {
              Write-Host "⏱️ [$([math]::Floor($elapsed))/$maxMinutes min] 🆔 $env:ANYDESK_ID | 🔑 Github2024 | ✅ Online" -ForegroundColor Green
            }
            
            Start-Sleep -Seconds 60
          }

      - name: Session Ended
        if: always()
        run: |
          Write-Host ""
          Write-Host "🔴 Sessão encerrada" -ForegroundColor Red
          Write-Host "ID usado: $env:ANYDESK_ID" -ForegroundColor Yellow
          Write-Host ""
